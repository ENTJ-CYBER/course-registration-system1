{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h1>My Enrollment History</h1>
</div>

<div class="card-grid">

  {% for e in enrollments %}

  <div class="card">

    <h3>{{ e.course_name }}</h3>

    <p><b>Code:</b> {{ e.course_code }}</p>
    <p><b>Status:</b> {{ e.status }}</p>

    
     {% if e.status == "enrolled" %}
  <span class="badge">Enrolled</span>
{% else %}
  <span class="badge dropped-badge">Dropped</span>
{% endif %}

  </div>

  {% endfor %}

</div>

{% endblock %}
